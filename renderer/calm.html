<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
  <title>Breathe</title>
  <link rel="stylesheet" href="calm.css">
</head>
<body>
  <main class="calm">
    <div class="orb" aria-hidden="true"><div class="orb-core"></div></div>
    <p class="cue" id="cue" aria-live="polite">Breathe in</p>
    <p class="line">You don't have to finish anything right now.</p>
    <footer class="foot">
      <button type="button" id="ready">I'm ready</button>
      <span class="hint">or press Esc</span>
    </footer>
  </main>
  <script src="calm.js"></script>
</body>
</html>
