# Builds the app for Mac (.dmg), Windows (.exe) and Linux (.AppImage) and publishes it to the public download repo.
#
# Fully automatic: change "version" in package.json (for example 1.0.2 to 1.0.3) and merge to main. If that version has
# no release yet, this workflow builds all three apps and publishes them as the newest release, which is what the
# download buttons on the website serve. Pushing a tag like v1.0.3 does the same, and so does "Run workflow" under Actions
# (a manual run only builds and keeps the files as workflow artifacts, it does not publish).
name: Release apps
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']   # only clean versions like v1.0.0, never v1.0.0-beta
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          RELEASE=false
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' is not a clean x.y.z version: nothing will be published."
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # A push to main releases only when the public repo has no release for this version yet.
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://github.com/concentr8-app/concentr8/releases/tag/v$VERSION")"
            echo "Public release page for v$VERSION answered $code"
            if [[ "$code" == "404" ]]; then RELEASE=true; fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION, publish: $RELEASE"

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: mac,   os: macos-latest,   script: dist,       files: 'release/*.dmg' }
          - { name: win,   os: windows-latest, script: 'dist:win', files: 'release/*.exe' }
          - { name: linux, os: ubuntu-latest,  script: 'dist:linux', files: 'release/*.AppImage' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build app
        shell: bash
        run: npm run "${{ matrix.script }}" -- --config.extraMetadata.version="${{ needs.plan.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Concentr8-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Publishes only the finished apps to the public download repo. The source code stays private.
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          repository: concentr8-app/concentr8
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.plan.outputs.version }}
          prerelease: false
          draft: false
          files: release/*
