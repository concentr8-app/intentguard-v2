# Builds the app for Mac (.dmg), Windows (.exe) and Linux (.AppImage) and publishes it to the public download repo.
#
# Fully automatic: every change to the app that lands on main (src/, renderer/, build/ or package.json) becomes a new
# version. The workflow takes the newest public release, adds 1 to the last number (1.0.4 -> 1.0.5), builds all three
# apps with that version and publishes them, which is what the download buttons and the in-app update notice serve.
# Changes to the server, the website or the docs do not change the app, so they do not make a new version.
# A bigger jump (for example 2.0.0) works by setting "version" in package.json higher than the newest release.
# Pushing a tag like v1.2.3 publishes exactly that version. "Run workflow" under Actions only builds (no publish).
name: Release apps
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']   # only clean versions like v1.0.0, never v1.0.0-beta
    branches: [main]
    paths: ['src/**', 'renderer/**', 'build/**', 'package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
# One release at a time, so two quick merges get two different version numbers instead of the same one.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          PKG="$(node -p "require('./package.json').version")"
          LATEST="$(git ls-remote --tags https://github.com/concentr8-app/concentr8 \
            | sed -n 's#.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' | sort -V | tail -1)"
          echo "package.json: $PKG, newest public release: ${LATEST:-none}"
          RELEASE=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$LATEST" ]]; then
              VERSION="$PKG"
            elif [[ "$PKG" != "$LATEST" && "$(printf '%s\n%s\n' "$PKG" "$LATEST" | sort -V | tail -1)" == "$PKG" ]]; then
              VERSION="$PKG"   # package.json was set higher on purpose
            else
              IFS=. read -r MA MI PA <<< "$LATEST"
              VERSION="$MA.$MI.$((PA + 1))"
            fi
            RELEASE=true
          else
            VERSION="$PKG"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not a clean x.y.z version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "### Building $VERSION (publish: $RELEASE)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: mac,   os: macos-latest,   script: dist,       files: 'release/*.dmg' }
          - { name: win,   os: windows-latest, script: 'dist:win', files: 'release/*.exe' }
          - { name: linux, os: ubuntu-latest,  script: 'dist:linux', files: 'release/*.AppImage' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build app
        shell: bash
        run: npm run "${{ matrix.script }}" -- --config.extraMetadata.version="${{ needs.plan.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Concentr8-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Publishes only the finished apps to the public download repo. The source code stays private.
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          repository: concentr8-app/concentr8
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.plan.outputs.version }}
          prerelease: false
          draft: false
          files: release/*
